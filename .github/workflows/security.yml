name: Security Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: sqlite:///db.sqlite3
      SECRET_KEY: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock pip-audit
      - run: python manage.py test
      - run: pip-audit -r requirements.lock
      - name: Validate production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-dummy-secret-key-for-github-actions-only-0123456789ABCDE
          ALLOWED_HOSTS: app.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
          CSRF_TRUSTED_ORIGINS: https://app.example.test
          MINIO_PUBLIC_ENDPOINT: app.example.test
          MINIO_PUBLIC_USE_HTTPS: "true"
        run: python manage.py validate_production
      - name: Django deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-dummy-secret-key-for-github-actions-only-0123456789ABCDE
          ALLOWED_HOSTS: app.example.test
          CORS_ALLOWED_ORIGINS: https://app.example.test
          CSRF_TRUSTED_ORIGINS: https://app.example.test
          MINIO_PUBLIC_ENDPOINT: app.example.test
          MINIO_PUBLIC_USE_HTTPS: "true"
        run: python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run audit:production
      - run: npm run build
