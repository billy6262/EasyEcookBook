# ─────────────────────────────────────────────────────────────────────────────
# EasyEcookBook — Production Docker Compose (base)
#
# Usage:
#   Development:  docker compose up          (auto-loads override.yml)
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Optional profiles:
#   Search:       docker compose --profile search up
# ─────────────────────────────────────────────────────────────────────────────

name: easyecookbook

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easyecookbook}
      POSTGRES_USER: ${POSTGRES_USER:-easyecookbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easyecookbook}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-compatible media storage) ─────────────────────────────────────
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── MinIO bucket initialiser (runs once, then exits) ────────────────────────
  mc:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing myminio/$${MINIO_BUCKET};
        mc anonymous set download myminio/$${MINIO_BUCKET};
        exit 0;
      "
    restart: "no"

  # ── Django Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - static_files:/app/staticfiles
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgresql://${POSTGRES_USER:-easyecookbook}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-easyecookbook}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_USE_HTTPS: "true"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_USE_HTTPS: ${MINIO_USE_HTTPS:-false}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@easyecookbook.local}
      ACCOUNT_EMAIL_VERIFICATION: ${ACCOUNT_EMAIL_VERIFICATION:-mandatory}
      MEILISEARCH_ENABLED: ${MEILISEARCH_ENABLED:-true}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme-not-for-production}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── MeiliSearch (optional full-text search) ──────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.10
    profiles: ["search"]
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme-not-for-production}
      MEILI_ENV: production
    restart: unless-stopped

  # ── Async Tasks — uncomment to enable Celery + Redis support ─────────────────
  # redis:
  #   image: redis:7-alpine
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #
  # celery:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   command: celery -A config worker --loglevel=info --concurrency=2
  #   environment:
  #     DJANGO_SETTINGS_MODULE: config.settings.production
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-easyecookbook}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-easyecookbook}
  #     SECRET_KEY: ${SECRET_KEY}
  #     REDIS_URL: redis://redis:6379/0
  #   depends_on:
  #     - redis
  #     - postgres
  #   restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  static_files:
  meilisearch_data:
  # redis_data:
