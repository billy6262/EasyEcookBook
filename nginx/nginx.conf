server {
    listen 80;
    server_name _;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options        "DENY"                            always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self'" always;

    client_max_body_size 20M;

    # NOTE: $http_x_forwarded_proto trusts the upstream to set this header
    # correctly. In production this container's port is loopback-bound by
    # default (see docker-compose.prod.yml HTTP_BIND) and is expected to sit
    # behind a TLS-terminating load balancer/reverse proxy that overwrites
    # X-Forwarded-Proto itself. If this container is ever exposed directly to
    # untrusted clients without such a terminator in front of it, revert this
    # to the literal $scheme so the header cannot be spoofed by the client.

    # ── Django API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── Django Admin ────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Django static files (admin CSS/JS) ──────────────────────────────────
    location /static/ {
        alias   /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media is intentionally public by product decision. MinIO remains private
    # to the Docker network and is only exposed through this proxy.
    location /media/ {
        proxy_pass http://minio:9000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── React SPA ────────────────────────────────────────────────────────────
    # All other routes serve index.html so React Router handles client-side nav.
    location / {
        root      /var/www/html;
        try_files $uri $uri/ /index.html;

        # Cache fingerprinted static assets indefinitely
        location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
